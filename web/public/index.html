<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover so env(safe-area-inset-*) reports real values on notched phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>the veil</title>
  <meta name="description" content="A hive mind you talk to — chat, swarms, and scheduled tasks, running on your own machine.">
  <meta name="application-name" content="the veil">
  <!-- both schemes declared: the browser paints the right chrome before app.js runs -->
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1b26" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="/icon.svg">
  <!-- PWA. The manifest is generated PER REQUEST from the Host header, so installing binds to whichever
       domain served this page — localhost or a public name — and never to a baked-in one. The icon route
       exists now (see pwaIcon), so unlike the favicon above these can be real links. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/styles.css">
  <script>
    /* Resolve the theme before first paint so there is no flash of the wrong
       scheme. Explicit choice wins; otherwise follow the OS. */
    try {
      var t = localStorage.getItem('veil.theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      var s = localStorage.getItem('veil.textScale');
      if (s) document.documentElement.style.setProperty('--text-scale', s);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
