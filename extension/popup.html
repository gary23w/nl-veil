<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      body {
        width: 260px;
        margin: 0;
        padding: 14px;
        font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      h1 { font-size: 13px; margin: 0 0 10px; font-weight: 600; }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
      .on { background: #22c55e; }
      .off { background: #94a3b8; }
      .paused { background: #f59e0b; }
      #state { margin-bottom: 10px; }
      .muted { color: #64748b; font-size: 12px; }
      label { display: block; margin: 10px 0 4px; font-size: 12px; }
      input { width: 100%; box-sizing: border-box; padding: 5px 7px; font: inherit; }
      .row { display: flex; gap: 6px; margin-top: 10px; }
      button { flex: 1; padding: 6px 8px; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>nl-veil browser link</h1>
    <div id="state"><span class="dot off"></span><span id="label">checking…</span></div>
    <div class="muted" id="detail"></div>

    <label for="port">Server port</label>
    <input id="port" type="number" placeholder="8787" />

    <div class="row">
      <button id="connect">Connect</button>
      <button id="pause">Pause</button>
    </div>
    <div class="row">
      <button id="disconnect">Disconnect</button>
    </div>

    <p class="muted" style="margin-top: 12px">
      The veil drives one background tab of its own. It never takes over the tab you are reading, and it will
      stop and ask you if a site puts up a human-verification check.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
