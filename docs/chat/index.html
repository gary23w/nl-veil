<script>
  /* The theme before first paint: the same key and rule as the rest of the site. */
  try {
    var t = localStorage.getItem('veil.theme.chosen') ? localStorage.getItem('veil.theme') : null;   /* only a theme the reader picked */
    if (!t) t = 'light';   /* the light theme, until the reader picks another */
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<script src="../js/analytics.js"></script>
