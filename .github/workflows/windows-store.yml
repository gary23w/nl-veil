name: Windows Store package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Submit an update to the existing live Microsoft Store product
        type: boolean
        default: false
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      release_tag:
        type: string
        default: ''
    secrets:
      AZURE_AD_TENANT_ID:
        required: false
      AZURE_AD_APPLICATION_CLIENT_ID:
        required: false
      AZURE_AD_APPLICATION_SECRET:
        required: false
      SELLER_ID:
        required: false

permissions:
  contents: read

concurrency:
  group: windows-store
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    env:
      STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
      STORE_DISPLAY_NAME: ${{ vars.STORE_DISPLAY_NAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Require reserved Store identity
        shell: pwsh
        run: |
          foreach ($value in @($env:STORE_IDENTITY_NAME, $env:STORE_PUBLISHER, $env:STORE_PUBLISHER_DISPLAY_NAME, $env:STORE_DISPLAY_NAME)) {
            if ([string]::IsNullOrWhiteSpace($value)) { throw 'Set the four STORE_* repository variables from Partner Center product identity before running this workflow.' }
          }
      - name: Verify release tag agrees with app version
        if: inputs.release_tag != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $match = Select-String -LiteralPath src/main.zig -Pattern '^const VERSION = "([^"]+)";$'
          $version = $match.Matches[0].Groups[1].Value
          if ($env:RELEASE_TAG -notmatch '^v[1-9][0-9]*\.[0-9]+\.[0-9]+$' -or $env:RELEASE_TAG -ne "v$version") {
            throw 'Store releases require a stable version tag matching src/main.zig'
          }
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Retrieve verified stable 1.1.16 memory engine
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path bin -Force | Out-Null
          gh release download v1.1.16 --repo gary23w/nl-veil --pattern veil-update-v1.1.16-windows-x86_64-neuron --dir bin
          if ($LASTEXITCODE -ne 0) { throw 'Stable memory engine download failed' }
          $engine = 'bin/veil-update-v1.1.16-windows-x86_64-neuron'
          $expected = 'AE6F95578B7D8E6DA38960391B315872D442A7D21118C88060DD19E8C8008D27'
          if ((Get-FileHash -LiteralPath $engine -Algorithm SHA256).Hash -ne $expected) { throw 'Stable memory engine checksum mismatch' }
          Move-Item -LiteralPath $engine -Destination bin/neuron.exe
      - name: Test and build desktop
        shell: pwsh
        run: |
          zig build test -Dapp=false -Dbuiltin=false
          if ($LASTEXITCODE -ne 0) { throw 'Server tests failed' }
          Push-Location desk
          try {
            zig build test
            if ($LASTEXITCODE -ne 0) { throw 'Desktop tests failed' }
          } finally { Pop-Location }
          zig build --prefix dist/windows-store/build
          if ($LASTEXITCODE -ne 0) { throw 'Desktop build failed' }
      - name: Package for Store upload
        shell: pwsh
        run: |
          $identity = @{
            identityName = $env:STORE_IDENTITY_NAME
            publisher = $env:STORE_PUBLISHER
            publisherDisplayName = $env:STORE_PUBLISHER_DISPLAY_NAME
            displayName = $env:STORE_DISPLAY_NAME
          }
          $identity | ConvertTo-Json | Set-Content -LiteralPath packaging/windows/store-identity.json -Encoding utf8
          ./scripts/package-store.ps1 -NeuronPath bin/neuron.exe
      - name: Upload reviewable submission artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-store-submission
          if-no-files-found: error
          path: |
            dist/windows-store/packages/*.msix
            dist/windows-store/packages/*.msix.json
            dist/windows-store/packages/stage-*/Assets/ListingIcon.png
            packaging/windows/store-listing.json
            packaging/windows/certification-notes.txt
            packaging/windows/README.txt

  publish:
    needs: package
    if: inputs.publish
    runs-on: windows-latest
    timeout-minutes: 30
    environment: microsoft-store-publishing
    permissions:
      contents: read
      id-token: write
    env:
      USE_STORE_OIDC: ${{ vars.STORE_AUTH_MODE == 'oidc' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: windows-store-submission
          path: store-submission
      - name: Require Microsoft publishing connection
        shell: pwsh
        env:
          STORE_PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          $required = @('STORE_PRODUCT_ID', 'AZURE_AD_TENANT_ID', 'AZURE_AD_APPLICATION_CLIENT_ID', 'SELLER_ID')
          if ($env:USE_STORE_OIDC -ne 'true') { $required += 'AZURE_AD_APPLICATION_SECRET' }
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing Microsoft publishing configuration: $name" }
          }
      - uses: microsoft/microsoft-store-apppublisher@v1.1
        with:
          version: v0.4.3
      - name: Authenticate Microsoft Store publisher
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          if ($env:USE_STORE_OIDC -eq 'true') {
            Import-Module ./scripts/store-oidc.psm1 -Force
            Invoke-MicrosoftStoreWithOidc -Arguments @('reconfigure', '--tenantId', $env:AZURE_AD_TENANT_ID, '--sellerId', $env:SELLER_ID, '--clientId', $env:AZURE_AD_APPLICATION_CLIENT_ID, '--clientAssertion')
          } else {
            msstore reconfigure --tenantId $env:AZURE_AD_TENANT_ID --sellerId $env:SELLER_ID --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID --clientSecret $env:AZURE_AD_APPLICATION_SECRET
            if ($LASTEXITCODE -ne 0) { throw 'Microsoft Store authentication failed' }
          }
      - name: Verify and submit package update
        shell: pwsh
        env:
          STORE_PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
        run: |
          $packageRoot = Join-Path $PWD 'store-submission/dist/windows-store/packages'
          $packages = @(Get-ChildItem -LiteralPath $packageRoot -Filter '*.msix' -File)
          if ($packages.Count -ne 1 -or $packages[0].Name -match 'development') { throw 'Expected exactly one production MSIX' }
          $package = $packages[0]
          $report = Get-Content -LiteralPath ($package.FullName + '.json') -Raw | ConvertFrom-Json
          if ($report.development -or (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash -ne $report.packageSha256) { throw 'Package integrity or identity check failed' }
          if ($env:USE_STORE_OIDC -eq 'true') {
            Import-Module ./scripts/store-oidc.psm1 -Force
            Invoke-MicrosoftStoreWithOidc -Arguments @('publish', $package.FullName, '--appId', $env:STORE_PRODUCT_ID)
            Invoke-MicrosoftStoreWithOidc -Arguments @('submission', 'status', $env:STORE_PRODUCT_ID)
          } else {
            msstore publish $package.FullName --appId $env:STORE_PRODUCT_ID
            if ($LASTEXITCODE -ne 0) { throw 'Microsoft Store update submission failed' }
            msstore submission status $env:STORE_PRODUCT_ID
            if ($LASTEXITCODE -ne 0) { throw 'Could not verify submission status' }
          }
          'Microsoft Store update submitted for certification. Microsoft controls the final certification and rollout.' >> $env:GITHUB_STEP_SUMMARY
